# Starship Configuration
# Inspired by Powerlevel10k Rainbow theme
# https://starship.rs/config/

# Main format
format = """
[╭─](238)$os$username$hostname$directory$git_branch$git_status$git_state$docker_context$nodejs$python$java$rust$golang$terraform$kubernetes$aws
[╰─](238)$character"""

# Right prompt
right_format = """$cmd_duration$time"""

# Wait 30ms for starship to check files (10ms is too aggressive for large repos)
scan_timeout = 30

# Add newline at start of prompt
add_newline = true

# OS Icon
[os]
disabled = false
style = "bold white"

[os.symbols]
Macos = " "

# Username
[username]
show_always = false
style_user = "bold yellow"
style_root = "bold red"
format = "[$user]($style) "

# Hostname
[hostname]
ssh_only = true
style = "bold green"
format = "[@$hostname]($style) "

# Directory
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " "
home_symbol = "~"

# Git Branch
[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch(:$remote_branch)]($style) "
truncation_length = 32
truncation_symbol = "..."

# Git Status
[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "~"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# Git State (rebase, merge, etc)
[git_state]
style = "bold yellow"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

# Character (prompt symbol)
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# Command Duration
[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "[$duration]($style) "

# Time (disabled by default - enable in ~/.config/starship.toml.local)
[time]
disabled = true
style = "bold white"
format = "[$time]($style)"

# Status (shows exit code of last command on error)
[status]
disabled = false
style = "bold red"
format = "[$status]($style) "

# === Language & Tool Contexts ===

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol($version)]($style) "

[python]
symbol = " "
style = "bold yellow"
format = "[$symbol$pyenv_prefix($version)(\\($virtualenv\\))]($style) "

[java]
symbol = " "
style = "bold red"
format = "[$symbol($version)]($style) "

[rust]
symbol = " "
style = "bold red"
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
style = "bold cyan"
format = "[$symbol($version)]($style) "

[docker_context]
symbol = " "
style = "bold blue"
format = "[$symbol$context]($style) "
only_with_files = true

[terraform]
symbol = "󱁢 "
style = "bold purple"
format = "[$symbol$workspace]($style) "

# === Cloud/DevOps (disabled by default - enable as needed) ===

[kubernetes]
symbol = "󱃾 "
style = "bold blue"
format = "[$symbol$context(\\($namespace\\))]($style) "
disabled = true  # Enable: set disabled = false

[aws]
symbol = " "
style = "bold orange"
format = "[$symbol($profile)(\\($region\\))]($style) "
disabled = true  # Enable: set disabled = false
